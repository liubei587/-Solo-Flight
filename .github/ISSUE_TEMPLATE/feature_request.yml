name: 功能建议
description: 提出一个改进或新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量只描述「问题与期望」，实现方式可以留给维护者一起讨论。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不方便？在什么场景下会用到？
      placeholder: "每次记录后想…，但现在需要…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？可以是交互、文案或数据层面的描述
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: dropdown
    id: scope
    attributes:
      label: 大致范围
      options:
        - 记录 / 首页
        - 历史 / 时间线
        - 统计 / 图表
        - 自定义（卡片、主题、背景）
        - 提醒 / 小组件
        - 导入 / 导出
        - 工程 / 构建 / 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 issues 与路线图，确认这不是重复建议
          required: true
        - label: 这个功能不要求申请网络权限或上传用户数据
          required: true
