name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索现有 issues。
        **请勿在 issue 中粘贴任何备份内容、keystore、密码或设备上的私人记录。**

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页「关于」里显示的版本号，或 APK 文件名
      placeholder: "v0.7.3 (versionCode 23)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手机型号 / Android 版本，或模拟器信息
      placeholder: "Pixel 8 / Android 14"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 首页 / 记录
        - 首页日历
        - 历史 / 时间线
        - 统计 / 图表
        - 统计卡片编辑
        - 主题 / 背景 / 桌面图标
        - 提醒 / 小组件
        - 导入 / 导出
        - 构建 / 安装
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图（可选）
      description: 请先打码个人信息与记录内容
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我使用的是最新 Release（或最新 main 构建），并已搜索过现有 issues
          required: true
        - label: 我没有在 issue 中粘贴密码、keystore、备份文件或私人记录
          required: true
